version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cove-crm-db
    environment:
      POSTGRES_USER: postgres          # ← Explicit
      POSTGRES_PASSWORD: mypassword123 # ← Explicit
      POSTGRES_DB: cove_crm           # ← Explicit
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: